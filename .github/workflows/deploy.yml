name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: "0.22.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Regenerate Chinese search index
        run: uv run --locked python scripts/build_zh_search_index.py

      - name: Verify Chinese search index is committed
        run: git diff --exit-code -- static/search_index.zh.json

      - name: Compute CJK font cache key
        id: cjk-font-cache
        run: echo "key=$(uv run --locked python scripts/build_font_subsets.py --print-cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore generated CJK font subsets
        uses: actions/cache@v4
        with:
          path: |
            .font-subsets-manifest.json
            static/fonts/noto-sans-sc/NotoSansSC-SiteSubset.woff2
            static/fonts/noto-serif-sc/NotoSerifSC-SiteSubset.woff2
          key: cjk-font-subsets-${{ runner.os }}-${{ steps.cjk-font-cache.outputs.key }}
          restore-keys: |
            cjk-font-subsets-${{ runner.os }}-

      - name: Run repository tests
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Install scholarly (fallback when SERPAPI_KEY absent)
        if: github.event_name != 'push'
        run: pip install scholarly

      - name: Refresh Google Scholar stats (best-effort)
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 2
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: timeout 60 python -u scripts/update_scholar_stats.py || echo "Scholar fetch failed or timed out; using committed fallback values."

      - name: Install pinned Zola release
        run: |
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /usr/local/bin
          zola --version

      - name: Build
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

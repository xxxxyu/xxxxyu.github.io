name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: "0.22.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Prepare search index and compute web-font cache key
        id: web-font-cache
        run: |
          font_cache_key=$(uv run --locked python -m scripts.prepare_assets --print-font-cache-key)
          echo "key=$font_cache_key" >> "$GITHUB_OUTPUT"

      - name: Restore generated web-font subsets
        uses: actions/cache@v4
        with:
          path: |
            .font-subsets-manifest.json
            static/fonts/generated/
          key: web-font-subsets-${{ runner.os }}-${{ steps.web-font-cache.outputs.key }}
          restore-keys: |
            web-font-subsets-${{ runner.os }}-

      - name: Run repository tests
        run: uv run --locked python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check loading behavior
        run: node --test tests/js/*.test.cjs

      - name: Install scholarly (fallback when SERPAPI_KEY absent)
        if: github.event_name != 'push'
        run: pip install scholarly

      - name: Refresh Google Scholar stats (best-effort)
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 2
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: timeout 60 python -u scripts/update_scholar_stats.py || echo "Scholar fetch failed or timed out; using committed fallback values."

      - name: Install pinned Zola release
        run: |
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /usr/local/bin
          zola --version

      - name: Build
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

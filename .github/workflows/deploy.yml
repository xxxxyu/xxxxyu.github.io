name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * *" # 08:17 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ZOLA_VERSION: "0.22.1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Prepare search index and compute web-font cache key
        id: web-font-cache
        run: |
          font_cache_key=$(uv run --locked python -m scripts.prepare_assets --print-font-cache-key)
          echo "key=$font_cache_key" >> "$GITHUB_OUTPUT"

      - name: Restore generated web-font subsets
        uses: actions/cache@v4
        with:
          path: |
            .font-subsets-manifest.json
            static/fonts/generated/
          key: web-font-subsets-${{ runner.os }}-${{ steps.web-font-cache.outputs.key }}
          restore-keys: |
            web-font-subsets-${{ runner.os }}-

      - name: Run repository tests
        run: uv run --locked python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check frontend behavior
        run: node --test tests/js/*.test.cjs

      - name: Check analytics collector
        run: npm --prefix analytics-worker test

      - name: Refresh Google Scholar stats (best-effort)
        id: scholar
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 2
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python -u scripts/update_scholar_stats.py

      - name: Commit changed Scholar data
        if: github.ref == 'refs/heads/main' && github.event_name != 'push' && steps.scholar.outcome == 'success'
        run: |
          git add -- data/scholar.json
          if git diff --cached --quiet; then
            echo "Scholar data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Google Scholar data"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Install pinned Zola release
        run: |
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /usr/local/bin
          zola --version

      - name: Build
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

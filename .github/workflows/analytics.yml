name: Analytics collector

on:
  push:
    branches: [main]
    paths:
      - 'analytics-worker/**'
      - '.github/workflows/analytics.yml'
  pull_request:
    branches: [main]
    paths:
      - 'analytics-worker/**'
      - '.github/workflows/analytics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  collector:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: analytics-worker
    env:
      WRANGLER_SEND_METRICS: "false"
      ANALYTICS_ENDPOINT: https://analytics.xxxxyu.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: analytics-worker/package-lock.json

      - run: npm ci

      - name: Test collector logic
        run: npm test

      - name: Test Workers runtime and storage
        run: npm run test:integration

      - name: Check deployment bundle
        run: npm run check

      - name: Deploy collector
        id: deployment
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy -- --tag "$GITHUB_SHA"

      - name: Verify public summaries
        id: verification
        if: github.ref == 'refs/heads/main'
        run: npm run smoke -- "$ANALYTICS_ENDPOINT" "$GITHUB_SHA"

      - name: Summarize deployment
        if: always() && github.ref == 'refs/heads/main'
        env:
          DEPLOYMENT_RESULT: ${{ steps.deployment.outcome }}
          VERIFICATION_RESULT: ${{ steps.verification.outcome }}
        run: |
          {
            echo "### Analytics collector"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- Deployment: $DEPLOYMENT_RESULT"
            echo "- Read-only verification: $VERIFICATION_RESULT"
            echo "- Endpoint: $ANALYTICS_ENDPOINT"
          } >> "$GITHUB_STEP_SUMMARY"
